{% extends "base.html" %}
{% block title %}Kaizo Store{% endblock %}
{% block content %}
<h1>{{ 'Editar jogo' if jogo else 'Novo jogo' }}</h1>
<form class="dados" method="post"
      action="{{ url_for('jogo.editar', id=jogo.id) if jogo else url_for('jogo.criar') }}">
    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" value="{{ jogo.titulo if jogo else '' }}" required>
    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao">{{ jogo.descricao if jogo and jogo.descricao else '' }}</textarea>
    <label for="preco">Preço</label>
    <input type="number" id="preco" name="preco" step="0.01" min="0" value="{{ jogo.preco if jogo else 0 }}" required>
    <label for="categoria_id">Categoria</label>
    <select id="categoria_id" name="categoria_id" required>
        {% for categoria in categorias %}
            <option value="{{ categoria.id }}" {% if jogo and jogo.categoria_id == categoria.id %}selected{% endif %}>{{ categoria.nome }}</option>
        {% endfor %}
    </select>
    <br><br>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('jogo.listar') }}">Cancelar</a>
</form>
{% endblock %}
