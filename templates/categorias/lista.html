{% extends "base.html" %}
{% block title %}Kaizo Store{% endblock %}
{% block content %}
<h1>Categorias</h1>
<p><a class="botao" href="{{ url_for('categoria.criar') }}">Nova categoria</a></p>
<table>
    <tr><th>Nome</th><th>Descrição</th><th>Ações</th></tr>
    {% for categoria in categorias %}
    <tr>
        <td><a href="{{ url_for('categoria.buscar', id=categoria.id) }}">{{ categoria.nome }}</a></td>
        <td>{{ categoria.descricao or '' }}</td>
        <td class="linha">
            <a class="botao" href="{{ url_for('categoria.editar', id=categoria.id) }}">Editar</a>
            <form action="{{ url_for('categoria.deletar', id=categoria.id) }}" method="post">
                <button class="perigo" type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    {% else %}
    <tr><td colspan="3">Nenhuma categoria cadastrada.</td></tr>
    {% endfor %}
</table>
{% endblock %}
