{% extends "base.html" %}
{% block title %}Kaizo Store{% endblock %}
{% block content %}
<h1>Editar jogador</h1>
<form class="dados" method="post" action="{{ url_for('jogador.editar', id=jogador.id) }}">
    <label for="nickname">Nickname</label>
    <input type="text" id="nickname" name="nickname" value="{{ jogador.nickname }}" required>
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" value="{{ jogador.email }}" required>
    <br><br>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('jogador.buscar', id=jogador.id) }}">Cancelar</a>
</form>
{% endblock %}
