<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kaizo Store{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('main.index') }}"><strong>Kaizo Store</strong></a>
        {% if session.get('jogador_id') %}
        <nav>
            <a href="{{ url_for('main.catalogo') }}">Catálogo</a>
            <a href="{{ url_for('jogo.listar') }}">Jogos</a>
            <a href="{{ url_for('categoria.listar') }}">Categorias</a>
            <a href="{{ url_for('pacote.listar') }}">Pacotes</a>
            <a href="{{ url_for('jogador.listar') }}">Jogadores</a>
        </nav>
            <a href="{{ url_for('jogador.buscar', id=session['jogador_id']) }}">{{ session['jogador_nickname'] }}</a>
            <a href="{{ url_for('auth.logout') }}">Sair</a>
        {% else %}
            <nav></nav>
            <a href="{{ url_for('auth.login') }}">Entrar</a>
            <a href="{{ url_for('auth.cadastro') }}">Criar conta</a>
        {% endif %}
    </header>

    <main>
        {% for mensagem in get_flashed_messages() %}
            <p class="aviso">{{ mensagem }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <footer>Kaizo Store</footer>
</body>
</html>
