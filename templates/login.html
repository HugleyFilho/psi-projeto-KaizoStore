{% extends "base.html" %}
{% block title %}Kaizo Store{% endblock %}
{% block content %}
<h1>Entrar</h1>
<form class="dados" action="{{ url_for('auth.login') }}" method="post">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>
    <br><br>
    <button type="submit">Entrar</button>
</form>
<p>Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
{% endblock %}
