{% extends "base.html" %}
{% block title %}Kaizo Store{% endblock %}
{% block content %}
<h1>{{ 'Editar pacote' if pacote else 'Novo pacote' }}</h1>
<form class="dados" method="post"
      action="{{ url_for('pacote.editar', id=pacote.id) if pacote else url_for('pacote.criar') }}">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" value="{{ pacote.nome if pacote else '' }}" required>
    <label for="quantidade_moeda">Quantidade de moedas</label>
    <input type="number" id="quantidade_moeda" name="quantidade_moeda" min="0" value="{{ pacote.quantidade_moeda if pacote else 0 }}" required>
    <label for="preco">Preço</label>
    <input type="number" id="preco" name="preco" step="0.01" min="0" value="{{ pacote.preco if pacote else 0 }}" required>
    <label for="jogo_id">Jogo</label>
    <select id="jogo_id" name="jogo_id" required>
        {% for jogo in jogos %}
            <option value="{{ jogo.id }}" {% if pacote and pacote.jogo_id == jogo.id %}selected{% endif %}>{{ jogo.titulo }}</option>
        {% endfor %}
    </select>
    <br><br>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('pacote.listar') }}">Cancelar</a>
</form>
{% endblock %}
